[package]
name = "rexling-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[features]
default = ["ghostty"]
ghostty = []
iroh = ["dep:iroh", "dep:rex-iroh", "tokio/rt-multi-thread"]

[build-dependencies]
cc = "1"

[dependencies]
anyhow = "1"
base64 = "0.22"
getrandom = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
iroh = { version = "1.4.2", optional = true }
percent-encoding = "2.3"
png = "0.18"
rex-iroh = { version = "0.1", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2.5"

[dev-dependencies]
tempfile = "3"

[workspace]
members = [".", "jni", "probe"]
resolver = "2"
